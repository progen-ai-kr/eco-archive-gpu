<body class="products-page">

  <a class="skip-link" href="#mainContent">본문으로 건너뛰기</a>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="images/brand/echo-archive-logo.png" alt="ECHO ARCHIVE 홈" /></a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primaryNav">☰</button>
      <nav class="nav-menu" id="primaryNav" aria-label="주요 메뉴">
        <a href="about.html" data-ch="01">About</a>
        <a href="products.html" data-ch="02" class="active" aria-current="page">Shop</a>
        <a href="portfolio.html" data-ch="04">Archive</a>
        <a href="contact.html" data-ch="05">Contact</a>
      </nav>
    </div>
  </header>

  <main id="mainContent">

    <section class="page-head channel-head">
      <div class="channel-head-top">
        <p class="channel-code" data-scroll="left">CH.02 <strong>SIG_LOOKS</strong></p>
        <p class="channel-stamp" data-scroll="right">PRODUCT ARCHIVE</p>
      </div>
      <h1 data-scroll="left">SHOP</h1>
    </section>

    <!-- ===== 제품 목록 =====
         ★ 제품은 여기 HTML이 아니라 products.json 파일에서 관리합니다.
         products.json에 제품을 추가하면 이 목록과 상세 페이지에 자동으로 나타납니다. -->
    <section class="section products-grid-section" aria-labelledby="productListTitle">
      <!-- 카드 제목이 h3라서 h2가 없으면 h1 → h3로 건너뛴다. 화면에는 이미 "SHOP"
           헤드가 있어 중복이므로 스크린리더에만 읽히도록 .sr-only로 둔다. -->
      <h2 id="productListTitle" class="sr-only">제품 목록</h2>
      <div class="grid" id="product-list" aria-live="polite" aria-busy="true">
        <!-- products.json 내용이 자동으로 채워집니다 -->
      </div>
      <noscript><p>제품 목록을 보려면 JavaScript를 켜 주세요. 제품 문의는 <a href="mailto:echo_archive@gmail.com">이메일</a>로 보내실 수 있습니다.</p></noscript>
    </section>

    <div class="yy-rule" aria-hidden="true"><span class="yy-rule-node"></span></div>

    <section class="section archive-note">
      <p class="eyebrow" data-scroll="left">THE ARCHIVE CONTINUES</p>
      <h2 class="closing-title" data-scroll="up">기록은 계속 이어집니다.</h2>
      <p class="archive-note-links" data-scroll="up">
        <a href="portfolio.html" class="btn btn-primary"><span>ARCHIVE 살펴보기</span><span class="btn-arrow" aria-hidden="true">→</span></a>
        <a href="contact.html" class="btn btn-secondary"><span>문의하기</span><span class="btn-arrow" aria-hidden="true">→</span></a>
      </p>
    </section>

  </main>

  <footer class="footer">
    <a href="index.html" class="logo"><img src="images/brand/echo-archive-logo.png" alt="ECHO ARCHIVE 홈" /></a>
    <p class="biz">ECHO ARCHIVE / 방려명</p>
    <p>
      <a href="https://instagram.com/echo___archive" target="_blank" rel="noopener noreferrer">@echo___archive</a>
      · <a href="mailto:echo_archive@gmail.com">echo_archive@gmail.com</a>
    </p>
    <p>© ECHO ARCHIVE. All rights reserved.</p>
  </footer>

  <script src="script.js?v=20260916-mobile-1"></script>
  <!-- 홈 TV의 YIN/YANG 링크를 같은 기준으로 해석합니다. 제품 운영 데이터는 건드리지 않습니다. -->
  <script src="scripts/home-logic.js"></script>
  <script src="scripts/capsule-data.js"></script>
  <script src="catalog.js?v=20260826-rich-editor-1"></script>
  <script src="scripts/scroll-pages.js?v=20260916-1"></script>
  <script>
    // 공개된 products.json 제품을 카드로 그립니다. 학생은 CSS로 자유롭게 디자인할 수 있습니다.
    const productListBox = document.getElementById("product-list");

    // 제품을 불러온 뒤 새 요소의 스크롤 초점을 연결합니다.
    function notifyProductsRendered() {
      productListBox.setAttribute("aria-busy", "false");
      document.dispatchEvent(new Event("echo:products-rendered"));
    }

    function formatPrice(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (!/^\d+$/.test(text)) return text;
      return Number(text).toLocaleString("ko-KR") + "원";
    }

    // 빈 목록은 로딩 카드 대신 짧은 안내를 보여 푸터까지 바로 이동할 수 있게 합니다.
    function renderEmptyState() {
      productListBox.innerHTML = '<p class="portfolio-status" role="status">공개된 제품이 아직 없습니다. 새로운 기록을 준비하고 있습니다.</p>';
      notifyProductsRendered();
    }

    function renderProductCards(products) {
      productListBox.innerHTML = products
        .map((p, index) => {
          const image = ProductCatalog.safeImageUrl(p.images && p.images[0]);
          const img = image
            ? '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="' + ProductCatalog.escapeHtml(p.name) + '" loading="lazy" onerror="this.style.display=\'none\'" />'
            : "";
          const displayPrice = formatPrice(p.price);
          const price = displayPrice ? '<p class="price">' + ProductCatalog.escapeHtml(displayPrice) + "</p>" : "";
          const category = String(p.category || "").trim();
          return (
            '<a class="card glass-panel glass-corners" data-category="' + ProductCatalog.escapeHtml(category.toLowerCase()) +
            '" href="product.html?id=' + encodeURIComponent(p.id) + '" aria-label="' + ProductCatalog.escapeHtml(p.name) + ' 자세히 보기">' +
            '<div class="card-img" data-scroll="image" data-scroll-side="' + (index % 2 ? 'right' : 'left') + '"><span class="card-ep" aria-hidden="true"></span>' + img + "</div>" +
            '<div class="card-body">' +
            '<p class="k" data-scroll="detail">' + ProductCatalog.escapeHtml(p.label || p.category || "") + "</p>" +
            '<h3 data-scroll="detail">' + ProductCatalog.escapeHtml(p.name) + "</h3>" +
            '<p data-scroll="detail">' + ProductCatalog.escapeHtml(p.summary || "") + "</p>" + price +
            "</div>" +
            "</a>"
          );
        })
        .join("");
      notifyProductsRendered();
    }

    ProductCatalog.loadVisibleProducts()
      .then((products) => {
        if (!products.length) {
          renderEmptyState();
          return;
        }
        const logic = window.EchoHomeLogic;
        const requestedPolarity = logic && logic.resolvePolarityQuery(new URLSearchParams(window.location.search).get("polarity"));
        const capsuleEntries = window.EchoCapsuleData || [];
        const visibleProducts = requestedPolarity && logic
          ? logic.filterProductsByPolarity(products, requestedPolarity, capsuleEntries)
          : products;

        renderProductCards(visibleProducts);
      })
      .catch(() => {
        productListBox.innerHTML =
          '<div class="catalog-feedback"><p class="portfolio-status" role="status">제품을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>' +
          '<button class="btn ghost" type="button" data-retry-products>다시 불러오기</button></div>';
        productListBox.querySelector("[data-retry-products]").addEventListener("click", () => location.reload());
        notifyProductsRendered();
      });
  </script>
  <script src="scripts/mobile-motion.js?v=20260918-detail-1"></script>
</body>
</html>
