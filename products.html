<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제품 — ECHO ARCHIVE</title>
  <meta name="description" content="ECHO ARCHIVE의 시즌 컬렉션을 소개합니다." />
  <meta property="og:title" content="제품 — ECHO ARCHIVE" />
  <meta property="og:description" content="ECHO ARCHIVE의 시즌 컬렉션을 소개합니다." />
  <meta property="og:image" content="images/brand/echo-archive-logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="images/brand/echo-archive-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital@1&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260902-design-1c" />
</head>
<body class="products-page">

  <a class="skip-link" href="#mainContent">본문으로 건너뛰기</a>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="images/brand/echo-archive-logo.png" alt="ECHO ARCHIVE 홈" /></a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primaryNav">☰</button>
      <nav class="nav-menu" id="primaryNav" aria-label="주요 메뉴">
        <a href="about.html" data-ch="01">About</a>
        <a href="products.html" data-ch="02" class="active" aria-current="page">All Looks</a>
        <a href="portfolio.html" data-ch="04">Portfolio</a>
        <a href="contact.html" data-ch="05">Contact</a>
      </nav>
    </div>
  </header>

  <main id="mainContent">

    <section class="page-head channel-head">
      <div class="channel-head-top">
        <p class="channel-code">CH.02 <strong>SIG_LOOKS</strong></p>
        <p class="channel-stamp">PRODUCT ARCHIVE</p>
      </div>
      <h1>ALL LOOKS</h1>
    </section>

    <section class="section products-toolbar-section" aria-label="카테고리 필터">
      <div class="filter-rail" id="productFilterRail" hidden>
        <p class="filter-rail-label">FILTER</p>
        <div class="filter-chips" id="productFilterChips" role="group" aria-label="카테고리로 필터"></div>
      </div>
    </section>

    <!-- ===== 제품 목록 =====
         ★ 제품은 여기 HTML이 아니라 products.json 파일에서 관리합니다.
         products.json에 제품을 추가하면 이 목록과 상세 페이지에 자동으로 나타납니다. -->
    <section class="section" aria-labelledby="productListTitle">
      <!-- 카드 제목이 h3라서 h2가 없으면 h1 → h3로 건너뛴다. 화면에는 이미 "ALL LOOKS"
           헤드가 있어 중복이므로 스크린리더에만 읽히도록 .sr-only로 둔다. -->
      <h2 id="productListTitle" class="sr-only">제품 목록</h2>
      <div class="grid" id="product-list" aria-live="polite">
        <!-- products.json 내용이 자동으로 채워집니다 -->
      </div>
    </section>

    <div class="yy-rule" aria-hidden="true"><span class="yy-rule-node"></span></div>

    <section class="section archive-note">
      <p class="archive-note-links">
        <a href="portfolio.html" class="btn btn-yang"><span class="btn-yinyang-icon" aria-hidden="true"></span>SIG_RECORD 보기</a>
        <a href="contact.html" class="btn btn-yin"><span class="btn-yinyang-icon" aria-hidden="true"></span>문의하기</a>
      </p>
    </section>

  </main>

  <footer class="footer">
    <a href="index.html" class="logo"><img src="images/brand/echo-archive-logo.png" alt="ECHO ARCHIVE 홈" /></a>
    <p class="biz">ECHO ARCHIVE / 방려명</p>
    <p>
      <a href="https://instagram.com/echo_archive" target="_blank" rel="noopener noreferrer">@echo_archive</a>
      · <a href="mailto:echo_archive@gmail.com">echo_archive@gmail.com</a>
    </p>
    <p>© ECHO ARCHIVE. All rights reserved.</p>
  </footer>

  <script src="script.js?v=20260902-design-1b"></script>
  <!-- 홈 TV의 YIN/YANG 링크를 같은 기준으로 해석합니다. 제품 운영 데이터는 건드리지 않습니다. -->
  <script src="scripts/home-logic.js"></script>
  <script src="scripts/capsule-data.js"></script>
  <script src="catalog.js?v=20260826-rich-editor-1"></script>
  <script>
    // 공개된 products.json 제품을 카드로 그립니다. 학생은 CSS로 자유롭게 디자인할 수 있습니다.
    const productListBox = document.getElementById("product-list");
    const filterRail = document.getElementById("productFilterRail");

    function formatPrice(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (!/^\d+$/.test(text)) return text;
      return Number(text).toLocaleString("ko-KR") + "원";
    }

    // 빈 상태(제품이 아직 없을 때)도 텍스트 한 줄 대신 스캔라인이 흐르는 카드형
    // 플레이스홀더로 보여준다 — 상업 사이트는 로딩·빈 상태에서 완성도가 갈린다.
    function renderEmptyState() {
      filterRail.hidden = true;
      const placeholder = '<div class="card card-placeholder" aria-hidden="true"><div class="card-img"></div><div class="card-body"><p class="k">SIGNAL</p><h3>SYNCING</h3></div></div>';
      productListBox.innerHTML = placeholder.repeat(3);
      const status = document.createElement("p");
      status.className = "portfolio-status";
      status.textContent = "CAPSULE ARCHIVE SYNCING — 공개된 제품이 아직 없습니다.";
      productListBox.after(status);
    }

    function renderProductCards(products) {
      productListBox.innerHTML = products
        .map((p) => {
          const image = ProductCatalog.safeImageUrl(p.images && p.images[0]);
          const img = image
            ? '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="' + ProductCatalog.escapeHtml(p.name) + '" loading="lazy" onerror="this.style.display=\'none\'" />'
            : "";
          const displayPrice = formatPrice(p.price);
          const price = displayPrice ? '<p class="price">' + ProductCatalog.escapeHtml(displayPrice) + "</p>" : "";
          const category = String(p.category || "").trim();
          return (
            '<a class="card glass-panel glass-corners" data-category="' + ProductCatalog.escapeHtml(category.toLowerCase()) +
            '" href="product.html?id=' + encodeURIComponent(p.id) + '" aria-label="' + ProductCatalog.escapeHtml(p.name) + ' 자세히 보기">' +
            '<div class="card-img"><span class="card-ep" aria-hidden="true"></span>' + img + "</div>" +
            '<div class="card-body">' +
            '<p class="k">' + ProductCatalog.escapeHtml(p.label || p.category || "") + "</p>" +
            "<h3>" + ProductCatalog.escapeHtml(p.name) + "</h3>" +
            "<p>" + ProductCatalog.escapeHtml(p.summary || "") + "</p>" + price +
            "</div>" +
            "</a>"
          );
        })
        .join("");
    }

    function setupCategoryFilter(products) {
      const categories = [...new Set(products.map((product) => String(product.category || "").trim()).filter(Boolean))];
      if (categories.length < 2) {
        filterRail.hidden = true;
        return;
      }

      filterRail.hidden = false;
      const filters = [{ key: "", label: "ALL" }].concat(categories.map((category) => ({ key: category.toLowerCase(), label: category })));
      function selectCategory(key) {
        renderProductCards(key ? products.filter((product) => String(product.category || "").trim().toLowerCase() === key) : products);
        filterRail.querySelectorAll("button").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.category === key));
        });
      }

      filterRail.querySelector("#productFilterChips").innerHTML = filters.map((filter, index) =>
        '<button class="filter-chip" type="button" data-category="' + ProductCatalog.escapeHtml(filter.key) +
        '" aria-pressed="' + String(index === 0) + '">' + ProductCatalog.escapeHtml(filter.label) + "</button>"
      ).join("");
      filterRail.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => selectCategory(button.dataset.category));
      });
    }

    ProductCatalog.loadVisibleProducts()
      .then((products) => {
        if (!products.length) {
          renderEmptyState();
          return;
        }
        const logic = window.EchoHomeLogic;
        const requestedPolarity = logic && logic.resolvePolarityQuery(new URLSearchParams(window.location.search).get("polarity"));
        const capsuleEntries = window.EchoCapsuleData || [];
        const visibleProducts = requestedPolarity && logic
          ? logic.filterProductsByPolarity(products, requestedPolarity, capsuleEntries)
          : products;

        renderProductCards(visibleProducts);
        setupCategoryFilter(visibleProducts);
      })
      .catch(() => {
        filterRail.hidden = true;
        productListBox.innerHTML =
          '<p class="portfolio-status">SIGNAL LOST — 제품 기록을 불러오지 못했습니다. 로컬 정적 서버에서 다시 확인해 주세요.</p>';
      });
  </script>
</body>
</html>
