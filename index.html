  <!-- ===== 공용 머티리얼 =====
       TV 캐비닛·장식이 공유하는 그라데이션/필터를 한 번만 정의한다.
       (validate_site.py가 중복 id를 거부하므로 부품마다 defs를 두지 않는다.)
       크롬이 금속으로 읽히는 핵심은 중간의 급격한 '어두움→흰색' 전환이다 —
       실제 크롬에 비치는 수평선 반사를 흉내낸 것. -->
  <svg class="tv-materials" aria-hidden="true" focusable="false">
    <defs>
      <!-- 웹툰 화풍은 셀 셰이딩(딱 떨어지는 평면 톤)이라 그라데이션을 거의 쓰지 않는다.
           남긴 건 소켓 하나뿐 — 실제 금속 원반이라 여기만 광택이 필요하다. -->
      <radialGradient id="matChromeDisc" cx="0.34" cy="0.28" r="0.85">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="42%" stop-color="#d4dae0" />
        <stop offset="74%" stop-color="#89919a" />
        <stop offset="100%" stop-color="#eaeef2" />
      </radialGradient>
      <!-- 깃털 한 장. 뿌리가 (0,0)이고 끝이 왼쪽(-x)을 향하며, 끝은 볼록한 U자다
           (악마 날개의 오목한 막과 대비되는 지점).
           날개는 이 한 장을 translate/rotate/scale로 배치해 층층이 쌓는다.
           non-scaling-stroke가 없으면 scale에 따라 선 두께가 같이 커져서
           깃털마다 선 굵기가 달라진다 — 웹툰 선화에서는 치명적이라 고정한다. -->
      <!-- 깃털 한 장. 뿌리(0,0)가 넓고 끝(-x)으로 갈수록 좁아지는 물방울형이다 —
           양끝이 둥근 알약 모양으로 그리면 겹쳤을 때 '접시 더미'로 보인다.
           날개는 이 한 장을 translate/rotate/scale로 배치해 층층이 쌓는다.
           non-scaling-stroke가 없으면 scale에 따라 선 두께가 같이 커져서
           깃털마다 선 굵기가 달라진다 — 웹툰 선화에서는 치명적이라 고정한다. -->
      <path id="matWingLobe" vector-effect="non-scaling-stroke"
        d="M0 -16 C -24 -18, -48 -16, -64 -8 C -70 -5, -70 1, -64 3 C -48 9, -24 14, 0 16 C 6 12, 6 -12, 0 -16 Z" />
      <filter id="fxDrop" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a545f" flood-opacity="0.34" />
      </filter>
      <filter id="fxDropSoft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4a545f" flood-opacity="0.26" />
      </filter>
    </defs>
  </svg>
